<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>The Garden</title>
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Root Application Container -->
  <main id="app-root" class="app-root" aria-hidden="true">
    
    <!-- 1. Loading Layer (Version 1.2 Immersive Entry) -->
    <div id="layer-loading" class="layer layer-loading">
      <canvas id="loading-canvas" class="loading-canvas"></canvas>
      <div class="loading-container">
        <svg class="monogram-svg" viewBox="0 0 200 100" aria-label="Personalized initials">
          <path class="draw-path path-left" d="M 45,25 C 35,25 30,35 30,45 C 30,65 50,75 65,75 C 75,75 80,70 80,60 C 80,50 70,45 60,50 C 50,55 55,65 65,65" />
          <path class="draw-path path-amp" d="M 103,63 C 97,57 93,51 98,45 C 102,40 106,44 102,50 C 96,57 91,61 106,65" />
          <path class="draw-path path-right" d="M 120,65 L 120,35 C 120,35 128,55 135,55 C 142,55 150,35 150,35 L 150,65 C 150,65 155,70 165,70" />
        </svg>
        <p class="loading-message">Someone made something special for you...</p>
      </div>
    </div>

    <!-- 2. World Container (Contains all core visual layers) -->
    <div id="layer-world" class="layer layer-world">
      
      <!-- Environment Layer -->
      <div id="layer-environment" class="layer sub-layer">
        <canvas id="environment-canvas" class="environment-canvas"></canvas>
        <canvas id="stars-canvas" class="stars-canvas"></canvas>
        <canvas id="moon-canvas" class="moon-canvas"></canvas>
        <canvas id="clouds-canvas" class="clouds-canvas"></canvas>
      </div>

      <!-- Foreground Layer -->
      <div id="layer-foreground" class="layer sub-layer">
        <canvas id="meadow-canvas" class="meadow-canvas"></canvas>
      </div>

      <!-- Effects Layer -->
      <div id="layer-effects" class="layer sub-layer">
        <canvas id="effects-canvas" class="effects-canvas"></canvas>
      </div>

      <!-- UI Layer (Version 3.2: Interactive Birthday Envelope Setup) -->
      <div id="layer-ui" class="layer sub-layer">
        
        <div class="envelope-wrapper">
          <div class="envelope-shadow"></div>

          <!-- Interactive Envelope Component -->
          <div class="envelope" id="interactive-envelope" tabindex="0" role="button" aria-label="Open Birthday Letter">
            <div class="moonlight-shine"></div>

            <div class="envelope-back"></div>
            
            <!-- Hidden letter card containing a golden edge (partially revealed during unfold sequence) -->
            <div class="letter-preview">
              <div class="letter-gold-rim"></div>
            </div>

            <div class="sparkles-container" id="envelope-sparkles"></div>

            <!-- Overlapping pocket flaps -->
            <div class="envelope-pocket"></div>
            
            <!-- 3.D Rotatable Folding flap container -->
            <div class="envelope-flap-group">
              <div class="envelope-flap"></div>
              <!-- Wax seal is nested here so it pivots realistically on flap rotation -->
              <div class="wax-seal"></div>
            </div>
          </div>

          <!-- Procedural grass blades nestling the envelope -->
          <div class="meadow-nest" id="meadow-nest-grass">
            <div class="nest-blade nest-blade-1"></div>
            <div class="nest-blade nest-blade-2"></div>
            <div class="nest-blade nest-blade-3"></div>
            <div class="nest-blade nest-blade-4"></div>
            <div class="nest-blade nest-blade-5"></div>
          </div>
        </div>

      </div>

    </div>

    <!-- 3. Overlay Layer (Reserved for global transitions, vignettes, post-processing) -->
    <div id="layer-overlay" class="layer layer-overlay"></div>

  </main>

  <script src="script.js"></script>
</body>
</html>
